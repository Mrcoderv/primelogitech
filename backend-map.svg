<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="be-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="svc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Prime Logic Tech — Deployment Architecture</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#64748b">Frontend (Vercel) → Backend (Render) → Database (Render PostgreSQL)</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- FRONTEND BOX -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="40" y="80" width="320" height="760" rx="10" fill="url(#fe-grad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">🌐 Frontend (Vercel)</text>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#64748b">React 19 + Vite 8 + Tailwind 4</text>

  <!-- Entry point -->
  <rect x="80" y="140" width="240" height="40" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">main.jsx → App.jsx</text>
  <text x="200" y="170" text-anchor="middle" font-size="9" fill="#64748b">BrowserRouter + AuthProvider</text>

  <!-- Public Pages -->
  <rect x="80" y="195" width="240" height="135" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="200" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Public Pages</text>
  <text x="95" y="232" font-size="9" fill="#334155">• Home  (/about)</text>
  <text x="95" y="247" font-size="9" fill="#334155">• About  (/services)</text>
  <text x="95" y="262" font-size="9" fill="#334155">• Services  (/portfolio)</text>
  <text x="95" y="277" font-size="9" fill="#334155">• Portfolio  (/careers)</text>
  <text x="95" y="292" font-size="9" fill="#334155">• Contact  (/contact)</text>
  <text x="95" y="307" font-size="9" fill="#334155">• Careers  (/)</text>
  <text x="95" y="322" font-size="9" fill="#334155">• Navbar / Footer (shared)</text>

  <!-- Admin Pages -->
  <rect x="80" y="345" width="240" height="145" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="200" y="363" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">🔒 Admin Pages (/secret-admin/*)</text>
  <text x="95" y="382" font-size="9" fill="#334155">• Login (no auth required)</text>
  <text x="95" y="397" font-size="9" fill="#334155">• Dashboard (stats overview)</text>
  <text x="95" y="412" font-size="9" fill="#334155">• Projects (CRUD)</text>
  <text x="95" y="427" font-size="9" fill="#334155">• Team Members (CRUD)</text>
  <text x="95" y="442" font-size="9" fill="#334155">• Services / Testimonials (CRUD)</text>
  <text x="95" y="457" font-size="9" fill="#334155">• Jobs / Contacts / Newsletter</text>
  <text x="95" y="472" font-size="9" fill="#334155">• Site Content (edit homepage)</text>

  <!-- API Service Layer -->
  <rect x="80" y="505" width="240" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="200" y="523" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">📡 API Service Layer</text>
  <text x="95" y="542" font-size="9" fill="#334155">• Axios client with base URL from env</text>
  <text x="95" y="557" font-size="9" fill="#334155">• JWT Bearer token interceptor</text>
  <text x="95" y="572" font-size="9" fill="#334155">• Auto-refresh on 401</text>

  <!-- Auth Context -->
  <rect x="80" y="595" width="240" height="55" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="200" y="613" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">🔐 Auth Context</text>
  <text x="95" y="632" font-size="9" fill="#334155">• AuthProvider with user state</text>
  <text x="95" y="647" font-size="9" fill="#334155">• ProtectedRoute wrapper</text>

  <!-- Environment -->
  <rect x="80" y="665" width="240" height="70" rx="6" fill="#ffe4e6" stroke="#fbcfe8" stroke-width="1"/>
  <text x="200" y="683" text-anchor="middle" font-size="10" font-weight="bold" fill="#be123c">⚙️ Vercel Env Variables</text>
  <text x="95" y="702" font-size="9" fill="#334155">VITE_API_URL=https://</text>
  <text x="95" y="717" font-size="9" fill="#334155">  backend-name.onrender.com</text>

  <!-- User Browser -->
  <rect x="80" y="755" width="240" height="50" rx="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="200" y="780" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">👤 User Browser</text>
  <text x="200" y="795" text-anchor="middle" font-size="9" fill="#64748b">HTTPS → Vercel CDN</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BACKEND BOX -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="440" y="80" width="320" height="760" rx="10" fill="url(#be-grad)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">⚙️ Backend (Render)</text>
  <text x="600" y="124" text-anchor="middle" font-size="10" fill="#64748b">Django 5.x + DRF + Gunicorn</text>

  <!-- Django Config -->
  <rect x="470" y="140" width="260" height="80" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="600" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Django Config</text>
  <text x="485" y="177" font-size="9" fill="#334155">• settings.py (DB, CORS, JWT, Email)</text>
  <text x="485" y="192" font-size="9" fill="#334155">• urls.py (API routing)</text>
  <text x="485" y="207" font-size="9" fill="#334155">• wsgi.py (Gunicorn entry)</text>

  <!-- Models -->
  <rect x="470" y="235" width="260" height="120" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="600" y="253" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">📦 Django Models (7)</text>
  <text x="485" y="272" font-size="9" fill="#334155">• SiteContent (singleton CMS)</text>
  <text x="485" y="287" font-size="9" fill="#334155">• Project (portfolio items)</text>
  <text x="485" y="302" font-size="9" fill="#334155">• TeamMember (bio + links)</text>
  <text x="485" y="317" font-size="9" fill="#334155">• Service, Testimonial, Job</text>
  <text x="485" y="332" font-size="9" fill="#334155">• ContactMessage, NewsletterSubscriber</text>
  <text x="485" y="347" font-size="9" fill="#334155">• All with auto-ordering & active flags</text>

  <!-- Serializers -->
  <rect x="470" y="370" width="260" height="60" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="600" y="388" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">📝 Serializers (8)</text>
  <text x="485" y="407" font-size="9" fill="#334155">• DRF ModelSerializers for all models</text>
  <text x="485" y="422" font-size="9" fill="#334155">• All fields exposed</text>

  <!-- Views / API Endpoints -->
  <rect x="470" y="445" width="260" height="135" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">🌍 API Endpoints (17 views)</text>
  <text x="485" y="482" font-size="9" fill="#334155">🔓 Public (AllowAny):</text>
  <text x="490" y="497" font-size="9" fill="#475569">GET  /api/site-content/</text>
  <text x="490" y="512" font-size="9" fill="#475569">GET  /api/projects/ | /team/ | /services/</text>
  <text x="490" y="527" font-size="9" fill="#475569">GET  /api/testimonials/ | /jobs/</text>
  <text x="490" y="542" font-size="9" fill="#475569">POST /api/contact/ | /api/newsletter/</text>
  <text x="485" y="562" font-size="9" fill="#334155">🔒 Admin (IsAdminUser):</text>
  <text x="490" y="577" font-size="9" fill="#475569">CRUD /api/admin/* for all resources</text>

  <!-- Auth -->
  <rect x="470" y="595" width="260" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="600" y="613" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">🔐 JWT Authentication</text>
  <text x="485" y="632" font-size="9" fill="#334155">POST /api/token/  +  POST /api/token/refresh/</text>
  <text x="485" y="647" font-size="9" fill="#334155">Access: 8h  |  Refresh: 7d  |  Rotate enabled</text>

  <!-- CORS -->
  <rect x="470" y="670" width="260" height="45" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="600" y="688" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">🌐 CORS Config</text>
  <text x="485" y="705" font-size="9" fill="#334155">Vercel frontend URL + localhost dev</text>

  <!-- Render Build Process -->
  <rect x="470" y="730" width="260" height="75" rx="6" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="600" y="748" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">🔄 Render Build / Start</text>
  <text x="485" y="767" font-size="9" fill="#334155">1. Docker build → pip install -r reqs</text>
  <text x="485" y="782" font-size="9" fill="#334155">2. collectstatic → migrate (runtime)</text>
  <text x="485" y="797" font-size="9" fill="#334155">3. gunicorn 3 workers :8000</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DATABASE BOX -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="840" y="80" width="320" height="330" rx="10" fill="url(#db-grad)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">🗄️ Database (Render)</text>
  <text x="1000" y="124" text-anchor="middle" font-size="10" fill="#64748b">PostgreSQL 16 — Free Tier</text>

  <rect x="870" y="145" width="260" height="120" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1000" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">PostgreSQL Schema</text>
  <text x="885" y="185" font-size="9" fill="#334155">• core_sitecontent (1 row singleton)</text>
  <text x="885" y="200" font-size="9" fill="#334155">• core_project (portfolio items)</text>
  <text x="885" y="215" font-size="9" fill="#334155">• core_teammember (team bios)</text>
  <text x="885" y="230" font-size="9" fill="#334155">• core_service, core_testimonial</text>
  <text x="885" y="245" font-size="9" fill="#334155">• core_job, core_contactmessage</text>
  <text x="885" y="260" font-size="9" fill="#334155">• core_newslettersubscriber</text>

  <rect x="870" y="280" width="260" height="50" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="1000" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">Render Free Tier Limits</text>
  <text x="885" y="318" font-size="9" fill="#334155">1 GB storage, 256 MB RAM (enough for this app)</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- EXTERNAL SERVICES -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="840" y="435" width="320" height="405" rx="10" fill="url(#svc-grad)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="463" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">🔌 External Services</text>

  <!-- Cloudinary -->
  <rect x="870" y="485" width="260" height="80" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1000" y="503" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">☁️ Cloudinary</text>
  <text x="885" y="522" font-size="9" fill="#334155">• Media file storage (images)</text>
  <text x="885" y="537" font-size="9" fill="#334155">• django-cloudinary-storage</text>
  <text x="885" y="552" font-size="9" fill="#334155">• Env: CLOUDINARY_CLOUD_NAME, etc.</text>

  <!-- Gmail SMTP -->
  <rect x="870" y="580" width="260" height="80" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1000" y="598" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">📧 Gmail SMTP</text>
  <text x="885" y="617" font-size="9" fill="#334155">• Sends contact form emails</text>
  <text x="885" y="632" font-size="9" fill="#334155">• EMAIL_HOST_USER / PASSWORD</text>
  <text x="885" y="647" font-size="9" fill="#334155">• App password required (2FA)</text>

  <!-- Environment Variables needed -->
  <rect x="870" y="680" width="260" height="145" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1000" y="698" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">🔑 Render Env Variables</text>
  <text x="885" y="717" font-size="9" font-family="monospace" fill="#334155">DEBUG=False</text>
  <text x="885" y="732" font-size="9" font-family="monospace" fill="#334155">SECRET_KEY=<generated></text>
  <text x="885" y="747" font-size="9" font-family="monospace" fill="#334155">ALLOWED_HOSTS=*.onrender.com</text>
  <text x="885" y="762" font-size="9" font-family="monospace" fill="#334155">CORS_ALLOWED_ORIGINS=</text>
  <text x="885" y="777" font-size="9" font-family="monospace" fill="#334155">  https://app.vercel.app</text>
  <text x="885" y="792" font-size="9" font-family="monospace" fill="#334155">DATABASE_URL=postgres://...</text>
  <text x="885" y="807" font-size="9" font-family="monospace" fill="#334155">CLOUDINARY_*, EMAIL_*</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- User → Frontend -->
  <line x1="320" y1="780" x2="440" y2="780" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="380" y="772" text-anchor="middle" font-size="9" fill="#3b82f6">HTTPS</text>

  <!-- Frontend API → Backend -->
  <path d="M 440 540 L 470 540" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="455" y="533" text-anchor="middle" font-size="9" fill="#059669" font-weight="bold">HTTP /api/*</text>
  <text x="455" y="547" text-anchor="middle" font-size="8" fill="#059669">Axios → DRF</text>

  <!-- Backend → DB -->
  <path d="M 760 295 L 840 295" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="800" y="288" text-anchor="middle" font-size="9" fill="#d97706" font-weight="bold">Django ORM</text>
  <text x="800" y="302" text-anchor="middle" font-size="8" fill="#d97706">psycopg2</text>

  <!-- Backend → Cloudinary -->
  <path d="M 760 500 L 870 500" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="6,3"/>
  <text x="815" y="493" text-anchor="middle" font-size="8" fill="#7c3aed">Media Upload</text>

  <!-- Backend → Gmail -->
  <path d="M 760 625 L 870 625" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="6,3"/>
  <text x="815" y="618" text-anchor="middle" font-size="8" fill="#7c3aed">Email (SMTP)</text>

  <!-- Legend -->
  <rect x="880" y="825" width="280" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1020" y="843" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b">Legend</text>
  <line x1="895" y1="858" x2="935" y2="858" stroke="#059669" stroke-width="2.5"/>
  <text x="940" y="862" font-size="9" fill="#475569">HTTP API Call</text>
  <line x1="1050" y1="858" x2="1090" y2="858" stroke="#d97706" stroke-width="2.5"/>
  <text x="1095" y="862" font-size="9" fill="#475569">Database ORM</text>
  <line x1="895" y1="873" x2="935" y2="873" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="940" y="877" font-size="9" fill="#475569">External Service</text>
</svg>
