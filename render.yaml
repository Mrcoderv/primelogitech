# ──────────────────────────────────────────────────────────
# Prime Logic Tech — Render Infrastructure as Code
# Free-tier setup: Docker Web Service + PostgreSQL
# Deploy: Push to main → Render auto-deploys
# ──────────────────────────────────────────────────────────

services:
  # ── Backend Web Service ──────────────────────────────
  - type: web
    name: primelogitech-backend
    env: docker
    repo: https://github.com/Mrcoderv/primelogitech
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free

    # Render routes all traffic through nginx → your container
    # Health check tells Render the service is alive
    healthCheckPath: /api/site-content/

    envVars:
      # ── Django Core ──────────────────────────────
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random key
      - key: ALLOWED_HOSTS
        value: '.onrender.com,localhost,127.0.0.1'
      - key: PORT
        value: '8000'

      # ── CORS (allow frontend on Vercel) ──────────
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://primelogitech.vercel.app,http://localhost:5173,http://localhost:3000'

      # ── PostgreSQL (auto-provisioned by Render) ──
      - key: DATABASE_URL
        fromDatabase:
          name: primelogitech-db
          property: connectionString

      # ── Cloudinary (media storage - OPTIONAL) ────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Email (Gmail SMTP - OPTIONAL) ────────────
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ── Python version for Docker ────────────────
      - key: PYTHON_VERSION
        value: '3.12'

  # ── PostgreSQL Database (Free tier: 256 MB) ────────
  - type: database
    name: primelogitech-db
    plan: free
    region: oregon
