services:
  - type: web
    name: primelogitech-backend
    env: docker
    repo: https://github.com/Mrcoderv/primelogitech
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DEBUG
        value: 'False'
      - key: PYTHON_VERSION
        value: '3.12'
      - key: PORT
        value: '8000'
    healthCheckPath: /api/
